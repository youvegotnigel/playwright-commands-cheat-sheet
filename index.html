<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎭 Playwright Commands Dashboard </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img class="header-logo" src="images/playwright-logo.svg" alt="Playwright logo" width="44" height="44" />
  <span>Playwright Commands Dashboard</span>
  <img class="header-logo" src="images/playwright-logo.svg" alt="" aria-hidden="true" width="44" height="44" />
</header>

<div class="meta-bar">
  <span class="meta-badge"><span class="k">playwright</span><span class="v" style="background:#22c55e" id="pw-version">v1.65.0</span></span>
  <span class="meta-badge"><span class="k">last updated</span><span class="v" style="background:#38bdf8" id="last-updated">2026-11-07</span></span>
  <span class="meta-badge"><span class="k">commands</span><span class="v" style="background:#a855f7" id="cmd-count">305</span></span>
  <span class="meta-badge visitor-counter"><span class="k">visitors</span><span class="v" style="background:#fb923c" id="visitor-count-number">—</span></span>
</div>

<nav class="page-switch" aria-label="Pages">
  <a class="page-tab" href="index.html" aria-current="page"><svg class="tab-icon icon-commands" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect class="accent solid" x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"/></svg>Commands</a>
  <a class="page-tab" href="waiting.html"><svg class="tab-icon icon-waiting" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><g class="loop"><path d="M13.5 3.94A7 7 0 1 1 6.5 3.94"/><path d="M3.5 3.7L6.5 3.94L5.2 6.66"/></g><path class="accent" d="M10 6.5V10l2.5 1.5"/></svg>Waits</a>
  <a class="page-tab" href="locators.html"><svg class="tab-icon icon-locators" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path class="frame" d="M2.5 6.5V4A1.5 1.5 0 0 1 4 2.5h2.5M13.5 2.5H16A1.5 1.5 0 0 1 17.5 4v2.5M17.5 13.5V16a1.5 1.5 0 0 1-1.5 1.5h-2.5M6.5 17.5H4A1.5 1.5 0 0 1 2.5 16v-2.5"/><path class="accent solid cursor" d="M7 6.3l7.2 3.4-3.1 1.1 1.9 3.4-1.5.8-1.9-3.4-2.6 2.3z"/></svg>Selectors</a>
</nav>

<div class="container">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search commands, descriptions, tips..." aria-label="Search commands">
    <span class="search-shortcut" id="search-shortcut"></span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="toolbar">
    <button class="view-btn active" id="btnFlat">Flat</button>
    <button class="view-btn"        id="btnGrouped">Grouped</button>
  </div>
  <div id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-icon" id="btn-close-icon">×</span>
    <div class="modal-header">
      <h3 class="modal-title" id="m-title"></h3>
      <span class="level-badge" id="m-level"></span>
    </div>
    <p   class="modal-desc" id="m-desc"></p>
    <pre                    id="m-code"></pre>
    <div class="modal-tip"  id="m-tip"></div>
    <div class="modal-footer">
      <button class="btn-copy"  id="btn-copy">Copy</button>
      <a      class="btn-docs"  id="btn-docs" href="#" target="_blank">Docs ↗</a>
      <button class="btn-close" id="btn-close">Close</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/page-tabs.js"></script>
<script src="js/visitor-counter.js" defer></script>
<script src="js/visitor-display.js" defer></script>

</body>
</html>
